# ADR-014 eval harness: golden-set regression testing for the tailoring
# engine. `npm run eval` runs every apps/api/tailoring/engine.py change
# against golden.csv's 30 JD/facts pairs — the exit criterion PRD.md §11
# sets for Phase 3 ("eval harness can diff two prompt versions and report
# a pass/fail").
#
# Two independent gates per row, not one blended score:
#   1. truth_check.py (hard gate) — zero tolerance for unsupported claims,
#      ADR-006's core invariant. A prompt change that reads better but
#      leaks a fabricated claim must fail, full stop.
#   2. llm-rubric (soft gate, per-row __expected in golden.csv) — is the
#      output actually relevant and well-formed for that specific JD.
description: "Job Copilot — tailoring engine golden-set eval (ADR-014)"

prompts:
  - "Tailor a resume for: {{jd_title}} at {{jd_company}}"

providers:
  - id: file://providers/tailor_provider.py:call_api
    config:
      # WITHOUT THIS THE HARNESS CANNOT RUN AT ALL. promptfoo spawns the Python
      # provider with plain `python` (see PythonWorkerPool ->
      # getConfiguredPythonPath in the installed bundle), which on this machine
      # is the system interpreter — so `import instructor` inside
      # apps/api/tailoring/engine.py fails, the worker crash-loops 3x and the
      # run stalls with no useful error. That is why ADR-014's harness had never
      # completed a run before 2026-10-04.
      #
      # `config.pythonExecutable` is read by the python provider itself
      # (confirmed by reading promptfoo 0.120.19's own bundle, not from docs);
      # the PROMPTFOO_PYTHON env var is the equivalent override.
      # Path is relative to eval/. On Linux this becomes
      # ../apps/api/.venv/bin/python — this project's dev machine is Windows.
      pythonExecutable: ../apps/api/.venv/Scripts/python.exe

tests: file://golden.csv

# The per-row llm-rubric lives in golden.csv's `rubric_needs_grader` column,
# NOT `__expected` — deliberately renamed 2026-10-05 so promptfoo does not treat
# it as an assertion.
#
# Why: with an llm-rubric in `__expected` and no grader key, promptfoo does not
# merely fail the soft gate — it ERRORS the whole test before the python
# assertion runs, recording no response and no component results. A 30-row run
# produced "0 passed, 0 failed, 30 errors" and zero usable data. Removing the
# (broken) NIM grader in an earlier pass therefore made the harness strictly
# worse than leaving it in: at least a failing grader let the hard gate run.
#
# Renaming the column keeps the rubric text in the file for whenever a real
# grader key exists, while runs produce real numbers from the gate that matters.
# To re-enable: rename the column back to `__expected` AND set
# defaultTest.options.provider to an INDEPENDENT model (not the one being
# graded) that returns llm-rubric's JSON.
defaultTest:
  # No grader is configured; see the note above.
  #
  # promptfoo defaults to OpenAI and this project has no OpenAI key. Pointing
  # the grader at NIM's OpenAI-compatible endpoint was tried on 2026-10-04 and
  # does not work: nemotron-3-super does not reliably return the JSON shape
  # llm-rubric parses, giving 16x "No output" and 4x "Could not extract JSON"
  # across 30 rows. A configured-but-broken grader is worse than none — it fails
  # every row for the wrong reason and hides the truth_check gate below, which
  # does work. It would also have been the same model grading its own output.
  #
  # Consequence to know before reading a run: with no grader, every row's
  # llm-rubric assertion fails, so promptfoo's headline pass rate is always 0%.
  # READ THE PER-ASSERTION RESULTS OUT OF results-run.json, not the CLI summary.
  # See docs/harness-reports/adr014-first-eval-run.md.
  #
  # To restore a real soft gate, set options.provider to an INDEPENDENT model
  # (not the one being graded) that returns llm-rubric's JSON — needs a key this
  # project does not currently have.
  assert:
    - type: python
      value: file://assertions/truth_check.py:no_unsupported_claims
